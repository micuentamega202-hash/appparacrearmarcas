<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYK Action Planner</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--panel2:#1f232d;--border:#2a2f3b;--text:#e8eaf0;--muted:#9aa1b2;--accent:#f5b942;--accent2:#4f8ef7;--green:#3ecf8e;--red:#f26d6d;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
button{cursor:pointer;font-family:inherit}
/* SIDEBAR */
#sidebar{width:270px;min-width:270px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
#sidebar .logo{padding:18px 16px;border-bottom:1px solid var(--border)}
#sidebar .logo h1{font-size:17px;color:var(--accent)}
#sidebar .logo p{font-size:11px;color:var(--muted);margin-top:2px}
#clientList{flex:1;overflow-y:auto;padding:10px}
.clientCard{padding:11px 12px;border-radius:10px;margin-bottom:6px;cursor:pointer;border:1px solid transparent}
.clientCard:hover{background:var(--panel2)}
.clientCard.active{background:var(--panel2);border-color:var(--accent)}
.clientCard .cname{font-weight:600;font-size:14px}
.clientCard .cniche{font-size:11px;color:var(--muted);margin-top:2px}
.clientCard .cbar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.clientCard .cbar div{height:100%;background:var(--green)}
#sidebar .actions{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px}
.btn.primary{background:var(--accent);color:#1a1a1a;border:none;font-weight:600}
.btn.small{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--red)}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#topbar h2{font-size:18px}
#topbar .meta{font-size:12px;color:var(--muted)}
#topbar .spacer{flex:1}
#phaseTabs{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--border);overflow-x:auto;background:var(--bg)}
.ptab{padding:9px 13px;border-radius:10px 10px 0 0;font-size:12.5px;border:1px solid transparent;border-bottom:none;background:none;color:var(--muted);white-space:nowrap}
.ptab.active{background:var(--panel);color:var(--text);border-color:var(--border)}
.ptab .pct{font-size:10px;color:var(--green);margin-left:4px}
#content{flex:1;overflow-y:auto;padding:22px 26px 60px}
/* STEPS */
.step{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.step-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.step-head:hover{background:var(--panel2)}
.step-check{width:22px;height:22px;min-width:22px;border-radius:6px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;color:#1a1a1a}
.step.done .step-check{background:var(--green);border-color:var(--green)}
.step-title{font-weight:600;font-size:14.5px;flex:1}
.step.done .step-title{color:var(--muted);text-decoration:line-through}
.step-arrow{color:var(--muted);font-size:12px}
.step-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.step.open .step-body{display:block}
.step-desc{font-size:13.5px;line-height:1.65;color:#c7ccda;padding:12px 0;white-space:pre-wrap}
.block{margin-top:10px;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6}
.block h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.block.template{background:#141c2b;border:1px solid #24344f}
.block.template h4{color:var(--accent2)}
.block.example{background:#1d1a12;border:1px solid #4a3c1c}
.block.example h4{color:var(--accent)}
.block pre{white-space:pre-wrap;font-family:inherit;font-size:13px}
.copybtn{float:right;font-size:11px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px}
.copybtn:hover{color:var(--text)}
.step-notes{width:100%;margin-top:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px;font-size:13px;font-family:inherit;min-height:60px;resize:vertical}
/* METRICS */
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border-radius:var(--radius);overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:center}
th{background:var(--panel2);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
td input{width:70px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px;text-align:center;font-size:13px}
.rate{color:var(--accent);font-weight:600}
.kpi-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.kpi .v{font-size:24px;font-weight:700;color:var(--accent)}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:3px}
/* MODAL */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}
#modal.show{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;width:430px;max-width:92vw}
#modal h3{margin-bottom:16px;font-size:16px}
#modal label{font-size:12px;color:var(--muted);display:block;margin:12px 0 5px}
#modal input,#modal select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px;font-size:13.5px;font-family:inherit}
#modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.empty{color:var(--muted);text-align:center;margin-top:80px;line-height:1.8;font-size:14px}
.phase-intro{background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;padding:13px 16px;font-size:13px;line-height:1.6;color:#c7ccda;margin-bottom:16px;white-space:pre-wrap}
.tag{display:inline-block;font-size:10.5px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;color:var(--muted);margin-left:6px}
@media(max-width:760px){#sidebar{width:200px;min-width:200px}}
</style>
</head>

<div id="sidebar">

  <div id="clientList"></div>
  <div class="actions">
    <button class="btn" onclick="showCasos()">📚 Casos reales (mentorías)</button>
    <button class="btn primary" onclick="openNewClient()">+ Nuevo cliente</button>
    <button class="btn" onclick="exportData()">⬇ Exportar respaldo</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">⬆ Importar respaldo</button>

<div id="main">

  <div id="phaseTabs"></div>

    <div class="row">

  </div>
</div>

/* ================== ESTADO ================== */
let DB={clients:[],activeId:null};
const LS="syk_planner_v1";
function load(){try{const d=localStorage.getItem(LS);if(d)DB=JSON.parse(d)}catch(e){}}
function save(){localStorage.setItem(LS,JSON.stringify(DB))}
function client(){return DB.clients.find(c=>c.id===DB.activeId)}
function uid(){return Math.random().toString(36).slice(2,9)}

/* ================== CLIENTES ================== */
function openNewClient(){
 document.getElementById('fName').value='';document.getElementById('fService').value='';document.getElementById('fRevenue').value='';
 const sel=document.getElementById('fNiche');sel.innerHTML=Object.entries(NICHES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
 document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveClient(){
 const name=document.getElementById('fName').value.trim();if(!name)return alert('Poné un nombre');
 const c={id:uid(),name,niche:document.getElementById('fNiche').value,service:document.getElementById('fService').value,revenue:document.getElementById('fRevenue').value||0,done:{},notes:{},metrics:[],phase:"f0",created:Date.now()};
 DB.clients.push(c);DB.activeId=c.id;save();closeModal();renderAll();
}
function delClient(id){if(!confirm('¿Eliminar este cliente y todo su progreso?'))return;DB.clients=DB.clients.filter(c=>c.id!==id);if(DB.activeId===id)DB.activeId=DB.clients[0]?.id||null;save();renderAll()}
function progress(c){const total=PHASES.reduce((a,p)=>a+p.steps.length,0);const done=Object.values(c.done).filter(Boolean).length;return Math.round(done/total*100)}

/* ================== RENDER ================== */
function renderAll(){renderSidebar();renderTop();renderTabs();renderContent()}
function renderSidebar(){
 const el=document.getElementById('clientList');
 el.innerHTML=DB.clients.map(c=>`<div class="clientCard ${c.id===DB.activeId?'active':''}" onclick="DB.activeId='${c.id}';save();renderAll()">
  <div class="cname">${esc(c.name)}</div><div class="cniche">${NICHES[c.niche]?.label||c.niche} · ${progress(c)}% completado</div>
  <div class="cbar"><div style="width:${progress(c)}%"></div></div></div>`).join('')||'<div style="color:var(--muted);font-size:12.5px;padding:10px">Sin clientes todavía.</div>';
}
function renderTop(){
 const c=client();const el=document.getElementById('topbar');
 if(!c){el.innerHTML='<h2>SYK Action Planner</h2>';return}
 el.innerHTML=`<h2>${esc(c.name)}</h2><span class="tag">${NICHES[c.niche]?.label}</span>
 <span class="meta">${esc(c.service||'')}</span><div class="spacer"></div>
 <button class="btn small" onclick="exportClient()">⬇ Exportar cliente</button>
 <button class="btn small danger" onclick="delClient('${c.id}')">Eliminar</button>`;
}
function renderTabs(){
 const c=client();const el=document.getElementById('phaseTabs');
 if(!c){el.innerHTML='';return}
 const tabs=PHASES.map(p=>{
  const done=p.steps.filter(s=>c.done[p.id+'.'+s.id]).length;
  return `<button class="ptab ${c.phase===p.id?'active':''}" onclick="client().phase='${p.id}';save();renderAll()">${p.emoji} ${p.name}<span class="pct">${done}/${p.steps.length}</span></button>`;
 }).join('');
 el.innerHTML=tabs+`<button class="ptab ${c.phase==='tracker'?'active':''}" onclick="client().phase='tracker';save();renderAll()">📊 Tracker</button>`;
}
function renderContent(){
 const c=client();const el=document.getElementById('content');
 if(!c){el.innerHTML='<div class="empty">👋 Creá tu primer cliente con <b>+ Nuevo cliente</b><br>y empezá a trabajar el plan de acción paso a paso.</div>';return}
 if(c.phase==='tracker')return renderTracker(el,c);
 const p=PHASES.find(x=>x.id===c.phase)||PHASES[0];
 el.innerHTML=`<div class="phase-intro">${esc(p.intro)}</div>`+p.steps.map(s=>{
  const key=p.id+'.'+s.id;const done=c.done[key];const open=c._open===key;
  let body=`<div class="step-desc">${esc(s.d)}</div>`;
  if(s.tpl)body+=`<div class="block template"><button class="copybtn" onclick="copyTxt(this,\`${esc2(s.tpl)}\`)">copiar</button><h4>📋 Plantilla</h4><pre>${esc(s.tpl)}</pre></div>`;
  if(s.ex&&EX[s.ex]){const e=EX[s.ex][c.niche]||EX[s.ex].otro;const g=EX[s.ex].otro;
   body+=`<div class="block example"><button class="copybtn" onclick="copyTxt(this,\`${esc2(e)}\`)">copiar</button><h4>💡 Ejemplo — ${NICHES[c.niche]?.label}</h4><pre>${esc(e)}</pre></div>`;
   if(e!==g)body+=`<div class="block template"><h4>📋 Plantilla genérica</h4><pre>${esc(g)}</pre></div>`;}
  body+=`<textarea class="step-notes" placeholder="Notas / versión final para este cliente..." onchange="client().notes['${key}']=this.value;save()">${esc(c.notes[key]||'')}</textarea>`;
  return `<div class="step ${done?'done':''} ${open?'open':''}">
   <div class="step-head" onclick="toggleStep('${key}')">
    <div class="step-check" onclick="event.stopPropagation();toggleDone('${key}')">${done?'✓':''}</div>
    <div class="step-title">${esc(s.t)}</div><div class="step-arrow">${open?'▲':'▼'}</div></div>
   <div class="step-body">${body}</div></div>`;
 }).join('');
}
function toggleStep(k){const c=client();c._open=c._open===k?null:k;renderContent()}
function toggleDone(k){const c=client();c.done[k]=!c.done[k];save();renderAll()}
function copyTxt(btn,t){navigator.clipboard.writeText(t).then(()=>{btn.textContent='✓ copiado';setTimeout(()=>btn.textContent='copiar',1500)})}

/* ================== TRACKER ================== */
function renderTracker(el,c){
 if(!c.metrics.length)c.metrics.push(newWeek(c));
 const tot=c.metrics.reduce((a,w)=>{['a','b','cal','d','show','close','cash'].forEach(k=>a[k]=(a[k]||0)+(+w[k]||0));return a},{});
 const rate=(x,y)=>y>0?(x/y*100).toFixed(1)+'%':'—';
 el.innerHTML=`
 <div class="kpi-cards">
  <div class="kpi"><div class="v">${tot.d||0}</div><div class="l">Agendas totales (⭐ Estrella Polar)</div></div>
  <div class="kpi"><div class="v">${rate(tot.d,tot.a)}</div><div class="l">TAP — tasa de agenda (KPI ≥2,5%)</div></div>
  <div class="kpi"><div class="v">${rate(tot.show,tot.d)}</div><div class="l">Show-up (KPI ≥50%)</div></div>
  <div class="kpi"><div class="v">${rate(tot.close,tot.show)}</div><div class="l">Cierre (KPI ≥15-20%)</div></div>
  <div class="kpi"><div class="v">$${(tot.cash||0).toLocaleString()}</div><div class="l">Facturación acumulada</div></div>
 </div>
 <table><thead><tr><th>Semana</th><th>Iniciados (A)</th><th>Interesados (B)</th><th>Calendly (C)</th><th>Agendas (D)</th><th>Shows</th><th>Cierres</th><th>Cash USD</th><th>TAP</th><th></th></tr></thead>
 <tbody>${c.metrics.map((w,i)=>`<tr>
  <td>${esc(w.week)}</td>
  ${['a','b','cal','d','show','close','cash'].map(k=>`<td><input type="number" value="${w[k]||''}" onchange="client().metrics[${i}].${k}=+this.value;save();renderContent()"></td>`).join('')}
  <td class="rate">${rate(w.d,w.a)}</td>
  <td><button class="btn small danger" onclick="client().metrics.splice(${i},1);save();renderContent()">✕</button></td></tr>`).join('')}
 </tbody></table>
 <div style="margin-top:14px"><button class="btn primary" onclick="client().metrics.push(newWeek(client()));save();renderContent()">+ Agregar semana</button></div>
 <p style="margin-top:16px;font-size:12.5px;color:var(--muted);line-height:1.7">Regla SYK: si la Estrella Polar (agendas) está en KPI → no cambies nada, subí volumen. Si falla, identificá el tubo exacto (¿no responden? ¿no agendan? ¿no asisten? ¿no cierran?) y cambiá UNA variable por vez.</p>`;
}
function newWeek(c){const n=(c.metrics?.length||0)+1;return{week:'S'+n,a:0,b:0,cal:0,d:0,show:0,close:0,cash:0}}

/* ================== EXPORT / IMPORT ================== */
function exportData(){dl(JSON.stringify(DB,null,1),'syk_planner_respaldo.json')}
function exportClient(){const c=client();if(!c)return;dl(JSON.stringify({clients:[c],activeId:c.id},null,1),'syk_plan_'+c.name.replace(/\s+/g,'_')+'.json')}
function importData(ev){
 const f=ev.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);
  if(!d.clients)throw 0;
  d.clients.forEach(nc=>{const i=DB.clients.findIndex(x=>x.id===nc.id);if(i>=0){if(confirm('El cliente "'+nc.name+'" ya existe. ¿Reemplazar con la versión importada?'))DB.clients[i]=nc}else DB.clients.push(nc)});
  DB.activeId=d.activeId||DB.clients[0]?.id;save();renderAll();alert('Importado correctamente ✅');
 }catch(e){alert('Archivo inválido')}};
 r.readAsText(f);ev.target.value='';
}
function dl(txt,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click()}

/* ================== UTILS ================== */
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function esc2(s){return String(s??'').replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

{c:"Ofertas y promesas (casos reales)",t:"Estratega de contenido sin casos propios — recortar la tubería",b:["En OMV nunca prometas facturación: entre tu trabajo y la plata hay etapas que no controlás.","«Recortá la tubería: hacete muy buena en UNA parte» → promesa de llamadas agendadas.","Prometer $3K/mes extra es tierra de nadie: los que facturan eso no se motivan, los que no, no pueden pagar.","Prometé plata recién cuando tengas números propios: 70 agendas → 50 shows → 20% cierre → AOV $1.500 = $15K."]},
{c:"Ofertas y promesas (casos reales)",t:"Setter manager ($3M generados) — cuándo SÍ prometer facturación",b:["Solo si controlás o auditás TODA la tubería: si optimizás agendas y el cuello está en el cierre, no se convierte en plata.","Caso real SYK: sobraban leads pero los closers no tenían capacidad — más agendas hubieran roto el sistema.","Alternativa potente: «auditamos tu sistema comercial, encontramos TU cuello de botella y lo resolvemos para que factures $10K extra en 90 días».","Cobro en OMV: fee inicial bajo + 20-25% o por agenda según la promesa."]},
{c:"Ofertas y promesas (casos reales)",t:"Agencia de VSL funnels — cobro por llamada calificada (oferta espejo pura)",b:["Cobrar POR LLAMADA CALIFICADA descontando el costo publicitario: cobro $100/llamada − $40 de costo de ads = $60 míos.","Incentivo alineado: mientras mejor soy, más gano yo y menos paga el cliente. Cobrar cada 15-20 agendas.","Fee inicial máximo ~$200 justificado en costos. Estandarizar la inversión del cliente (ej. $500/mes en ads).","Velocidad: nicho+oferta se definen EN una llamada (grabar → ChatGPT → resumen); guión de VSL al día siguiente. «30 días para eso es un montón»."]},
{c:"Ofertas y promesas (casos reales)",t:"PNL para vendedores — redefinir el avatar en vez de competir",b:["No compitas donde no tenés autoridad (academias de closing con cifras millonarias): ampliá el avatar de «closers» a «coaches y vendedores».","Tu vehículo único (PNL, lenguaje hipnótico) es el diferencial que te posiciona.","El dolor real no era «depender de guiones»: era la tasa de cierre baja. La promesa se construye sobre el dolor REAL.","Promesa final: corta — resultado concreto + vehículo único + a quién + horizonte temporal (<120 días)."]},
{c:"Ofertas y promesas (casos reales)",t:"Agencia de IA sin nicho, desbordada — el caso ICO de libro",b:["7 proyectos todos distintos = colapso. «Tenés que anicharte. No veo otra solución.»","Techo de un freelancer con servicio personalizado: 4 clientes; productizado en un nicho: 6-7.","Plan de choque en 1 semana: definir nicho → rehacer landing/VSL → cambiar links de videos → contenido de nicho. Aceptar que agendas y views caen ~80%.","Elegir nicho: matriz de promedio ponderado. Factor #1: ¿te ves trabajando con esa gente 5-10 años?"]},
{c:"Ofertas y promesas (casos reales)",t:"Trading — comunidad, VSOP y operaciones simples",b:["Comunidades gratuitas: «la gente que busca comunidad gratis no es una ballena» — en SYK nunca convirtieron; solo bolsa de trabajo.","Lo que sí mueve en trading: live trading semanal (mejor YouTube en vivo, queda subido).","Validar VSOP con oferta ÚNICA ~$1.000 (no cebolla). Cebolla recién después de validar.","«Es un curso con calls, no es Amazon»: no frenes la venta por miedos operativos. ¿50 clientes? «Podés meter 150; si aparece el problema, lo resolvemos.»"]},
{c:"Contenido y marca (frameworks de Rama)",t:"Estructura universal de guion y mix de contenido",b:["Guiones (y carruseles): Atención → Problema → Solución → Prueba social → CTA. Siempre.","Mix: 30% contenido personal/mentalidad, 70% contenido de nicho. O bien: Problemas técnicos 50% · Resultados 30% · Mentalidad 20%.","Mínimo 1 reel con CTA por día: cuenta de 2.300 seguidores = 3-4 comentarios/video = 21+ conversaciones/semana.","El CTA en video no molesta: ya diste valor gratis. Nicho de tema único (ej. sueño): tema core + temas colindantes (rutina, ejercicio, nutrición)."]},
{c:"Contenido y marca (frameworks de Rama)",t:"Hooks que no se scrollean (masterclass en vivo)",b:["Hook genérico = scroll garantizado: «no vivís de tu marca personal porque no sabés cómo» servía en 2013, hoy no. Test: ¿VOS lo scrollearías?","Hook visual: pila de libros en la mano + «tenés todo este conocimiento pero le tenés terror a ESTO» (mostrás una cámara).","Lenguaje que duela: «hay pibes de 20 que suben videítos y hacen $100K/mes, y vos estudiaste 10 años y no hacés ni $5K».","Autoridad prestada: «le pagué $50.000 a este tipo para explicarte esto en 23 segundos».","Errores que matan videos: música que tapa el hook, subtítulos sobre la cara, edición IA recargada, presentador inexpresivo. Cámara limpia > sobreproducción."]},
{c:"Contenido y marca (frameworks de Rama)",t:"Carruseles: los 2 tipos",b:["Tipo 1 — Ángulo de dolor: estructura clásica; LA CLAVE ES EL ÁNGULO. «No te contratan como DJ porque no sos convocante» explotó; el mismo creador hablando de bookers, nada.","Hook al ego: «Los DJs que más fechas tienen no son los que mejor pinchan».","Tipo 2 — Entregable directo (hand raiser): «se descubrió esta IA → cómo funciona → resultado → comentá X y te la mando». Más viral, ideal faceless para tráfico frío, pero leads más fríos.","El de dolor trae leads de más calidad; el de entregable más alcance."]},
{c:"Contenido y marca (frameworks de Rama)",t:"La Campana de Gauss de la comunicación",b:["Nivel 1 = quebrados · Nivel 2 = tu cliente real · Nivel 3 = avanzados.","Comunicale al nivel 3 → te llega 80% de nivel 2 + 20% de nivel 3 (efecto aspiracional).","El error de todos: hablarle a su cliente promedio → les llega el nivel 1.","Tampoco irse demasiado arriba (llega gente calificada pero nadie responde): es «correrse un poquito a la derecha».","Complemento: videos anti-objeción («¿pagaste otra mentoría y no funcionó? problema tuyo por no investigar») — ablandan objeciones y suben la calificación."]},
{c:"Stories y DMs (sistema de Rama)",t:"Algoritmo de historias + secuencia CTA completa",b:["1) Borrar temprano las historias del día anterior. 2) Subir UNA historia gancho que explote en vistas. 3) Esperar ~1 hora. 4) Subir la secuencia CTA.","Secuencia: mostrar trabajo con clientes → «¿qué hago con ellos?» (entregables en un beneficio: «te resuelvo todo el contenido, así no pensás y convertís») → FOMO opcional → cierre.","Cierre: «si querés que te resuelva [X] para lograr [SUEÑO] sin [OBJECIONES], mandame DOC y te paso el doc» — suena a documento, NO a venta.","CTA = hand raiser con los entregables de tu programa. Las WINS siempre van DENTRO de una secuencia CTA.","Cadencia: 2 CTA de recurso + 2 hand raisers por semana. En historias se ofrece un recurso, nunca una llamada."]},
{c:"Stories y DMs (sistema de Rama)",t:"Lead magnets: la casa sin la llave",b:["Estructuralos para que falte el último 10%: «te construyo la casa entera, pero la llave la tengo yo».","En nichos de acompañamiento ni importa: «el gordo que no entrena no entrena ni con el curso gratis — no pagan por información, pagan por acompañamiento».","El mejor recurso = el que más (y mejores) leads te responden. Se descubre probando ángulos de dolor.","¿Saturación? No existe. Si hay fricción o tu cuenta es chica: dalo de entrada, recarga confianza.","Los Looms casi nadie los mira: «no les interesa VER el recurso, les interesa TENERLO». Reciclá los mismos por meses."]},
{c:"Stories y DMs (sistema de Rama)",t:"Abridores, leads calificados y tire kickers",b:["Mejor abridor: «¿cómo vas? ¿estás entrenando o por ahora nada?» (doble opción, siempre eligen una) o «¿qué probaste que no te funcionó?».","Lead calificado = alguien que PODÉS ayudar. Que no tenga plata hoy NO lo descalifica: «el que verdaderamente quiere, la consigue». La llamada se toma igual.","Nunca asumir «recién empieza = no tiene plata»: preguntá a dónde quiere llegar y vendé lo más caro.","Tire kickers (piden recursos y nunca agendan): cortar con honestidad + redirigir al dolor y a la agenda. «Si te lo tomás personal, perdiste.»"]},
{c:"Escalado y transiciones",t:"Rebranding / cambio de programa sin morir en el intento",b:["Si el mercado pide otra cosa (70% decía «no quiero ser viral, quiero clientes»): cambiá el mensaje YA — la cuenta no sufre, el alcance se mantiene.","NUNCA dejar de vender en la transición (money in): vendé el programa nuevo aunque no esté grabado; lo que falta se compensa con TU atención.","Convertí el cambio en marketing: mini-lanzamiento dramático («CDN muere para siempre») — a la gente le encanta el chisme. Carrusel post-mortem: 5.000 likes, stories vistas por 60.000.","Masterclass/webinar de lanzamiento: cierre agendando consultoría gratuita, nunca link de pago directo en high-ticket.","Revenue Generating Activities (subir historias + grabar videos) NUNCA se frenan."]},
{c:"Escalado y transiciones",t:"Low ticket + high ticket / un solo negocio",b:["El low ticket ($30-40) se vende SOLO con ads (landing + VSL); jamás promocionarlo en la marca personal («te llega gente sin un mango»).","Contenido del low ticket: perspectivas + 10% del valor — que quede excusa para pagar más. Usalo como downsell en chat.","Dos negocios a la vez: no. «Con cualquiera hacés plata, pero es difícil escalar UNO — no me imagino dos.»","Camino correcto: escalar la agencia → graduación → vender el DWY al MISMO nicho (Juan Pereira: agencia para realtors → consultoría para realtors).","Nichos tipo clínicas estéticas/cirugía: se venden con ADS, el orgánico es secundario (1-2 videos/semana de validación)."]},
{c:"Escalado y transiciones",t:"Operativa con clientes (agencia de contenido/funnels)",b:["Contrato ultra corto mostrado y firmado EN la misma llamada = señal de compromiso.","Con 1-2 casos de éxito ya cobrás retainer/adelantado.","Lo más importante del VSL funnel: trackear TODO el embudo — el creativo más barato por CPM no siempre es el más rentable.","Tracker manual 1×/día + columna de notas: UN cambio a la vez y verificar a la semana.","Truco Meta: eventos de conversión personalizados a la API (optimizar solo por leads que dicen tener +$10K para invertir) → baja costos.","CRM = solo ventas (si lo complejizás, los setters lo llenan mal); ficha de cliente en Notion; Trello para editores."]}
];
function showCasos(){
 document.getElementById('phaseTabs').innerHTML='';
 document.getElementById('topbar').innerHTML='<h2>📚 Casos reales de las mentorías SYK</h2><div class="spacer"></div><button class="btn small" onclick="renderAll()">← Volver al plan</button>';
 var cats=[...new Set(CASOS.map(x=>x.c))];
 document.getElementById('content').innerHTML='<div class="phase-intro">Extraído de las consultorías en vivo de Ramiro, Juani y Matías: diagnósticos reales, frameworks y frases textuales aplicados a nichos concretos. Usalo como biblioteca de referencia mientras trabajás el plan de cada cliente.</div>'+cats.map(cat=>'<h3 style="margin:20px 0 10px;color:var(--accent);font-size:15px">'+cat+'</h3>'+CASOS.filter(x=>x.c===cat).map(x=>'<div class="step open"><div class="step-head" style="cursor:default"><div class="step-title">'+x.t+'</div></div><div class="step-body"><ul style="padding:12px 0 4px 18px;line-height:1.75;font-size:13.5px;color:#c7ccda">'+x.b.map(i=>'<li style="margin-bottom:6px">'+i+'</li>').join('')+'</ul></div></div>').join('')).join('');
}

load();renderAll();
</script>
